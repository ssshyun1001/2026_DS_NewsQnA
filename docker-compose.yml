
services:
  db:
    image: pgvector/pgvector:pg17
    container_name: qupict-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: qupict
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: qupict
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - qupict_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qupict -d qupict"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  qupict_pgdata:

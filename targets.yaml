# 수집 대상 목록 (평가용 검색어 9개, 눈·후드·마스크는 의미별로 2개씩 → 항목 12개)
#
#   query         : 네이버 뉴스 검색어
#   sense         : 0단계 의미 후보 중 고를 의미 이름
#                   후보에 없으면 "직접 입력"으로 처리한다 (설명은 description, 없으면 sense 이름)
#   description   : (선택) 직접 입력할 때 쓸 설명
#   definition    : (선택) 사람이 확인한 한 줄 정의. 3단계 LLM 검증의 기준이 된다.
#   aliases       : (선택) 사람이 확인한 별칭. 적으면 LLM이 만든 별칭 대신 이 값을 쓴다.
#                   [] 를 적으면 "LLM 별칭을 쓰지 않음"
#   related_terms : (선택) 사람이 확인한 연관어. 적으면 LLM 연관어 대신 이 값을 쓴다.
#   period_days   : 수집 기간(일)
#   validation_term : (실험 A의 방법 1-b용) 예전 "검증 키워드" 방식의 검증어 1개. 팀 확인 필요
#
# 확인 방법: python -m qupict.sense --targets

- query: 서울여대
  sense: 서울여자대학교
  validation_term: 대학
  period_days: 30

- query: 삼전
  sense: 삼성전자
  validation_term: 반도체
  # LLM이 별칭에 '삼성'을 넣기도 함 → 삼성 라이온즈 등 다른 삼성 기사가 들어오므로 고정
  aliases: [삼성전자, Samsung Electronics]
  period_days: 30

- query: 베라
  # LLM이 '베라'를 배스킨라빈스로 알아보지 못함 (후보가 없거나 엉뚱한 후보만 나옴) → 직접 입력으로 처리
  sense: 배스킨라빈스
  validation_term: 아이스크림
  description: 아이스크림 브랜드 배스킨라빈스 (줄임말 '베라', '배라')
  aliases: [배스킨라빈스, 배라, Baskin Robbins]
  period_days: 30

- query: 강남
  sense: 방송인 강남
  validation_term: 방송인
  # LLM이 지어낸 정보가 섞임 (별칭 '조남식', 정의 '본명 조성민', 연관어 '비와이') → 팀이 확인한 값으로 교체
  definition: 가수 겸 방송인 강남 (그룹 M.I.B 출신, 스피드스케이팅 선수 이상화의 남편)
  aliases: []
  related_terms: [이상화, M.I.B, 예능, 유튜브, 방송, 출연]
  period_days: 30

- query: 애플
  sense: 기업 Apple
  validation_term: 아이폰
  period_days: 30

- query: 당근
  sense: 기업 당근(당근마켓)
  validation_term: 중고거래
  period_days: 30

# --- 같은 검색어, 다른 의미 ---------------------------------------------------
# 눈·후드·마스크는 "사용자가 다른 의미를 고르면 결과도 제대로 달라지는지" 보는 대상이라
# 의미마다 한 항목씩 둔다.

- query: 눈
  sense: 날씨 눈
  validation_term: 폭설
  period_days: 30

- query: 눈
  sense: 신체 기관 눈
  validation_term: 시력
  period_days: 30

- query: 후드
  sense: 의류 후드
  validation_term: 패션
  period_days: 30

- query: 후드
  sense: 주방 후드
  validation_term: 주방
  period_days: 30

- query: 마스크
  sense: 보건용 마스크
  validation_term: 미세먼지
  period_days: 30

- query: 마스크
  # LLM 후보에 마스크팩이 따로 없음 (가면 후보에 '팩'이 섞여 나옴) → 직접 입력
  sense: 마스크팩
  validation_term: 피부
  description: 얼굴에 붙이는 미용·스킨케어용 마스크팩
  period_days: 30

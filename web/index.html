<!doctype html>
<!--
  QuPicT 뉴스 Q&A — 화면의 뼈대

  파일 구성 (셋 다 web/ 폴더, 서버 web.py가 내보낸다)
    index.html   이 파일. 카드 · 입력칸 · 버튼의 배치         → 주소 /
    style.css    색 · 글꼴 · 모양                            → 주소 /static/style.css
    app.js       버튼을 눌렀을 때 하는 일 (서버 API 호출)     → 주소 /static/app.js
    QuPicT_logo_crop.svg   머리말 로고 · 브라우저 탭 아이콘. 원본(QuPicT_logo.svg, README에서 씀)의 둘레 빈 여백(약 9%)을 잘라
                           같은 크기에서 엠블럼이 더 크게 보인다 (그림은 같고 보이는 범위 viewBox만 다름)
    icon-32.png, icon-180.png   svg를 못 쓰는 브라우저용 탭 아이콘 · 아이폰 홈 화면 아이콘 (QuPicT.png를 같은 범위로 잘라 줄인 것)

  카드 순서: 1 검색어와 기간 → 2 의미 고르기 → 3 진행 상황 → ★ 많이 보도된 기사 Top 5 → 4 질문하기
  처음에는 1번 카드만 보이고, 나머지는 app.js가 차례로 연다 (class="hidden"을 뗀다).

  주의: id="…"는 app.js가 찾아 쓰는 이름이다. 지우거나 바꾸면 app.js도 같이 고쳐야 한다.
        (글자 · 배치 · class는 바꿔도 동작에는 영향이 없다)
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- 휴대폰에서도 화면 너비에 맞게 보이게 -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuPicT 뉴스 Q&amp;A</title>
<!-- 브라우저 탭 아이콘(파비콘) = QuPicT 로고.
     svg를 먼저 쓰고(선명), svg를 못 쓰는 브라우저는 32px png를 쓴다.
     apple-touch-icon: 아이폰에서 "홈 화면에 추가"했을 때 보이는 아이콘 (180px) -->
<link rel="icon" type="image/svg+xml" href="/static/QuPicT_logo_crop.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/static/icon-32.png">
<link rel="apple-touch-icon" href="/static/icon-180.png">
<!-- 휴대폰 주소창 색 (SWU BLUE) -->
<meta name="theme-color" content="#101077">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main>
  <!-- 머리말: 로고 + 제목. 그 아래 서비스 설명. id="info"에는 app.js가 LLM 모델 이름을 넣는다 -->
  <header class="brand">
    <img class="logo" src="/static/QuPicT_logo_crop.svg" alt="QuPicT 로고" width="64" height="64">
    <h1>QuPicT 뉴스 Q&amp;A</h1>
  </header>
  <p class="sub">검색어로 최근 뉴스를 모으고, 모은 기사 안에서 근거를 들어 답합니다. <br>
    QuPicT는 AI이며 인물 등에 관한 정보 제공 시 실수할 수 있습니다.
    중요한 정보는 확인하세요.<br>
    <span id="info"></span>
  </p>

  <!-- 1. 검색어
       다른 카드처럼 입력칸을 위에 모으고 버튼은 맨 아래 (.actions).
       넓은 화면: [검색어 | 기간 | 최대 수집 기사 수] 한 줄 → 아래 [의미 찾기]
       휴대폰: 칸마다 한 줄씩 세로로 → 맨 아래 [의미 찾기] (style.css 10번)
       [의미 찾기]를 누르면 app.js가 서버에 의미 후보를 묻고(/api/senses) 2번 카드를 연다.
       maxn: 네이버 검색으로 모을 최대 기사 수 (준비를 시작할 때 서버에 보낸다)
       s-query: 진행 · 오류 글이 나오는 줄 -->
  <section class="card">
    <h2><span class="step">1</span>검색어와 기간</h2>
    <form id="f-query">
      <div class="row">
        <div class="field"><label for="query">검색어</label><input id="query" type="text" placeholder="예: 애플, 강남" required></div>
        <div class="field small">
          <label for="days">기간 (최근 며칠)</label>
          <input id="days" type="number" min="1" max="365" value="30" required>
        </div>
        <div class="field small">
          <label for="maxn">최대 수집 기사 수</label>
          <input id="maxn" type="number" min="1" max="500" value="100">
        </div>
      </div>
      <div class="actions"><button id="b-query" type="submit">의미 찾기</button></div>
    </form>
    <div id="s-query" class="status"></div>
  </section>

  <!-- 2. 의미 선택
       senses: app.js가 의미 후보를 라디오 버튼으로 채운다 (맨 아래에 "기타 (직접 입력)")
       custom-box: "기타"를 골랐을 때만 보이는 설명 입력칸
       [이 의미로 뉴스 모으기]를 누르면 준비 작업이 시작되고(/api/prepare) 3 · ★ · 4번 카드가 열린다 -->
  <section id="c-sense" class="card hidden">
    <h2><span class="step">2</span>어떤 의미로 찾을까요?</h2>
    <p id="sense-src" class="note"></p>
    <form id="f-sense">
      <div id="senses" class="senses"></div>
      <div id="custom-box" class="hidden" style="margin-top:8px">
        <textarea id="custom" rows="2" placeholder="찾고 싶은 대상을 설명해 주세요 (예: 2020년대 활동하는 방송인 강남)"></textarea>
      </div>
      <div class="actions"><button id="b-sense" type="submit">이 의미로 뉴스 모으기</button></div>
    </form>
  </section>

  <!-- 3. 진행 상황
       log: 서버의 단계별 로그 (수집 → 필터링 → 인덱싱). app.js가 몇 초마다 확인해서 채운다
       s-job: 지금 상태 한 줄 ("처리 중…", "준비 완료 · N초", 오류) -->
  <section id="c-job" class="card hidden">
    <h2><span class="step">3</span>뉴스 수집 · 필터링 · 인덱싱</h2>
    <div id="log" class="log"></div>
    <div id="s-job" class="status"></div>
  </section>

  <!-- 3과 4 사이. 많이 보도된 기사: 수집한 기사 중 비슷한 기사(중복)가 가장 많이 묶인 기사 Top 5
       hot: 준비가 끝나면 app.js가 순위 목록을 채운다.
            "비슷한 기사 N건 ▸"을 누르면 묶인 기사 목록이 펼쳐져 하나씩 원문을 열 수 있다 -->
  <section id="c-hot" class="card hidden">
    <h2><span class="step">★</span>많이 보도된 기사 Top 5</h2>
    <p class="note">수집한 기사 중 같은 내용을 다룬 기사(중복)가 가장 많은 순서입니다.<br>
      제목을 누르면 원문이 열립니다.</p>
    <div id="hot"></div>
  </section>

  <!-- 4. 질문
       준비가 끝나기 전부터 열린다. 그동안 적은 질문은 준비가 끝나면 적은 순서대로 답한다.
       qa-label: 지금 질문하는 대상 ("강남 (방송인 강남)")
       qa-note: 안내 글 ("준비가 끝나면 답합니다" 등)
       chat: 질문 · 답변 말풍선이 쌓이는 곳 (답변은 만들어지는 대로 글자가 이어서 나온다) -->
  <section id="c-qa" class="card hidden">
    <h2>
      <span class="step">4</span>
      질문하기 <span id="qa-label" class="muted" style="font-weight:400"></span>
    </h2>
    <p id="qa-note" class="note"></p>
    <div id="chat" class="chat"></div>
    <form id="f-ask" class="row">
      <div class="field">
        <input id="question" type="text" required>
      </div>
      <button id="b-ask" type="submit">질문</button>
    </form>
  </section>
</main>

<!-- 화면 동작. 맨 아래에서 불러야 위의 칸 · 버튼이 모두 만들어진 뒤에 실행된다 -->
<script src="/static/app.js"></script>
</body>
</html>
